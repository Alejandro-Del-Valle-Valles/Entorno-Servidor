<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/Ejercicio04.css">
    <title>Ejercicio04 Inicio</title>
</head>
<body>
    <form>
        <!-- Languages -->
        <input type="radio" name="language" value="es" id="spanish" checked>
        <label for="spanish"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Flag_of_Spain.svg/1920px-Flag_of_Spain.svg.png" alt="Español"></label>
        <input type="radio" name="language" value="en" id="english">
        <label for="english"><img src="https://www.banderas-mundo.es/data/flags/w1600/gb.png" alt="English"></label><br>
        <div class="separator"></div>

        <!-- Number -->
        <label for="number">Introduce tu número: (1-10)</label>
        <input type="text" id="number"><br>
        <input type="button" id="play" value="Jugar"><br>
        <div id="user-input"></div><br>
        <div id="server-result"></div><br>
        <div id="result"></div><br>
        <input type="button" id="back" value="Volver">
    </form>
</body>
<script src="/script/Ejercicio04_02.js" defer></script>
</html>
