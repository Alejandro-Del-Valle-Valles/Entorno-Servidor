<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 02</title>
</head>
<body>
    <h1>Numeros en idiomas</h1>
    <form>
        <label><input type="radio" value="es" name="idioma" checked>Español</label>
        <label><input type="radio" value="en" name="idioma">Inglés</label>
        <label><input type="radio" value="de" name="idioma">Alemán</label><br>
        Introduce el número: <input type="number" id="numero" value="0" min="0" max="10" required><br>
        <input type="button" id="traducir" value="Traducir"><br>
    </form>
    <div id="resultado"></div>
</body>
<script src="/js/Ejercicio02.js"></script>
</html>
